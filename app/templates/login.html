{% extends "auth_layout.html" %}
{% block title %}Login{% endblock %}

{% block auth_content %}
<div class="mb-4">
    <h3 class="fw-bold mb-1" style="color: #0f172a; font-size: 1.75rem;">Sign In</h3>
    <p class="text-secondary small mb-0" style="font-size: 0.88rem;">Enter your credentials to access your account.</p>
</div>

<form action="/authenticate" method="POST">
    <div class="mb-3">
        <label for="email" class="form-label text-dark small fw-bold mb-1">Corporate Email</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="name@company.com" required autofocus>
    </div>
    
    <div class="mb-4">
        <label for="password" class="form-label text-dark small fw-bold mb-1">Password</label>
        <div class="password-field-wrapper">
            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
            <button class="toggle-password-btn" type="button" data-target="password" tabindex="-1" title="Toggle Password Visibility">
                <i class="ti ti-eye-off fs-5"></i>
            </button>
        </div>
    </div>
    
    <button type="submit" class="btn btn-dipcr w-100 mb-4" style="padding: 12px;">Sign In</button>
</form>

<div class="text-center">
    <p class="mb-0 small text-secondary">Don't have an account? <a href="{{ url_for('auth.register') }}">Claim your account</a></p>
</div>
{% endblock %}
